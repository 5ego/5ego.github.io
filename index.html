<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Streamed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%23d8392b'/><path d='M10 7.5 17 12 10 16.5Z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://api.themoviedb.org">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f; --bg2:#151518; --line:#2a2a2f; --text:#f4f4f5; --mute:#9a9aa3;
  --accent:#d8392b; --pad:4vw; --r:14px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg) radial-gradient(1200px 600px at 70% 0%, #1b1b1f 0%, transparent 70%);
  color:var(--text); font-family:Lexend,system-ui,sans-serif; min-height:100vh; min-height:100svh;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
img{display:block;max-width:100%}

/* ---------- nav ---------- */
.nav-wrap{position:fixed;top:12px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.nav{
  pointer-events:auto;display:flex;align-items:center;gap:6px;padding:7px 10px;
  background:rgba(16,16,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.07);border-radius:999px;max-width:100%;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;padding:0 12px 0 8px}
.brand svg{width:24px;height:24px;flex:none}
.nav a.tab{padding:9px 20px;border-radius:999px;font-weight:500;font-size:15px;color:#d6d6da;white-space:nowrap}
.nav a.tab:hover{color:#fff}
.nav a.tab.on{background:#fff;color:#000;font-weight:600}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.icon:hover{background:rgba(255,255,255,.08)}
.icon svg{width:19px;height:19px;fill:currentColor}
#q::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
#q{width:0;opacity:0;border:0;background:transparent;color:#fff;font:inherit;font-size:15px;outline:0;transition:width .25s,opacity .25s}
.nav.searching #q{width:190px;opacity:1;padding:0 6px}
.nav.searching .tab,.nav.searching .sep{display:none}
.pop{
  position:absolute;top:56px;right:0;width:320px;max-width:90vw;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r);padding:8px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)
}
.pop.open{display:block}
.pop h4{font-size:13px;color:var(--mute);font-weight:600;padding:8px 10px}
.pop a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:14px}
.pop a:hover{background:rgba(255,255,255,.06)}
.pop img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#222}
.pop strong{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.pop small{display:block;color:var(--mute)}
.pos{position:relative}

/* ---------- hero ---------- */
.hero{position:relative;height:min(92vh,880px);min-height:520px;overflow:hidden;background:#0d0d0f}
.slide{position:absolute;inset:0;opacity:0;z-index:1;transition:opacity .65s ease;pointer-events:none}
.slide.on{opacity:1;z-index:3;pointer-events:auto}
.slide.prev{opacity:1;z-index:2;pointer-events:none}
.slide>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;z-index:1}
.slide>img.bg{-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent 100%);mask-image:linear-gradient(180deg,#000 66%,transparent 100%)}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(13,13,15,.88) 0%,rgba(13,13,15,.25) 55%,transparent 80%)}
.hero-copy{position:absolute;z-index:3;left:var(--pad);top:50%;transform:translateY(-62%);max-width:min(560px,86vw)}
.hero-copy .logo{max-height:150px;max-width:100%;width:auto;object-fit:contain;object-position:left}
.hero-copy .ttl{font-family:Lexend,system-ui,sans-serif;font-size:clamp(44px,7vw,96px);line-height:.95;letter-spacing:.01em;color:#e7e7ea}
.hero-meta{margin-top:14px;color:#d6d6da;font-size:15px}
.hero-ov{margin-top:10px;color:#c4c4ca;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
.btns{display:flex;gap:12px;margin-top:22px}
.btn{height:48px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.light{background:#fff;color:#000}
.btn.light:hover{background:#e6e6e8}
.btn.dark{background:rgba(20,20,22,.7);border:1px solid var(--line);backdrop-filter:blur(8px)}
.btn.dark:hover{background:rgba(40,40,44,.8)}
.btn.red{background:var(--accent);color:#fff}
.dots{position:absolute;z-index:10;right:var(--pad);bottom:56px;display:flex;gap:8px}
.dots button{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots button.on{background:#fff;width:26px;border-radius:5px;transition:width .3s}
.down{position:absolute;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(20,20,22,.8);border:1px solid var(--line);display:grid;place-items:center}
.down svg{width:20px;height:20px;fill:#fff;transform:rotate(180deg)}

/* ---------- rows & cards ---------- */
.rows{position:relative;z-index:2;margin-top:-30px;padding-bottom:20px}
.row{padding:0 0 34px;position:relative}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--pad);margin-bottom:14px}
.row-head h2{font-size:clamp(20px,1.7vw,26px);font-weight:600}
.row-head a{color:var(--mute);font-size:14px}
.row-head a:hover{color:#fff}
.track{display:flex;gap:20px;overflow-x:auto;padding:4px var(--pad) 8px;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:0 var(--pad)}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(240px,19.6vw,380px);min-width:0;scroll-snap-align:start;display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#1b1b1f}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .play-overlay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.22);opacity:0;transition:opacity .2s;pointer-events:none}
.thumb .play-overlay span{width:54px;height:54px;border-radius:50%;background:rgba(15,15,17,.78);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;backdrop-filter:blur(5px)}
.thumb .play-overlay svg{width:22px;height:22px;fill:#fff;margin-left:3px}
@media (hover:hover){.card:hover .play-overlay{opacity:1}}
@media (hover:none){.thumb .play-overlay{opacity:.65;background:transparent}.thumb .play-overlay span{width:42px;height:42px}}
.card h3{font-size:17px;font-weight:500;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:14.5px;color:var(--mute);margin-top:4px}
.arrow{position:absolute;top:calc(50% - 40px);z-index:4;width:44px;height:44px;border-radius:50%;background:rgba(15,15,17,.85);
  border:1px solid var(--line);display:none;place-items:center}
.arrow svg{width:20px;height:20px;fill:#fff}
.arrow.l{left:10px}.arrow.l svg{transform:rotate(-90deg)}
.arrow.r{right:10px}.arrow.r svg{transform:rotate(90deg)}
@media (hover:hover){
  .row:hover .arrow, .row:focus-within .arrow{display:grid}
  .row:not(.has-left) .arrow.l{display:none}
}
.skel .thumb{animation:pulse 1.4s infinite}
.skel h3{height:16px;width:70%;margin-top:12px;border-radius:4px;background:#1e1e23;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.5}}

/* ---------- pages ---------- */
.page{padding:110px var(--pad) 60px}
.ph{font-size:clamp(28px,3vw,40px);font-weight:700;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 20px}
.grid .card{flex:none}
.more{display:block;margin:36px auto 0;height:46px;padding:0 28px;border-radius:999px;border:1px solid var(--line);font-weight:600}
.more:hover{background:rgba(255,255,255,.06)}
.more[hidden]{display:none}
.empty{color:var(--mute);padding:40px 0}

/* ---------- title page ---------- */
.player{max-width:1180px;margin:0 auto;border-radius:var(--r);overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.player iframe{display:block}
.eps{max-width:1180px;margin:14px auto 0;display:flex;gap:10px;flex-wrap:wrap}
.eps select{height:42px;padding:0 14px;border-radius:10px;background:var(--bg2);color:#fff;border:1px solid var(--line);font:inherit;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:#d0d0d5;font-size:15px}
.meta b{color:#fff;font-weight:600}
.ov{margin-top:18px;line-height:1.65;color:#d6d6da;max-width:68ch}

/* ---------- title page ---------- */
.tp{position:relative;padding:0 0 20px}
.th{position:relative;min-height:min(92vh,820px);display:flex;align-items:flex-end;justify-content:space-between;gap:40px;padding:130px var(--pad) 56px;overflow:hidden;background:#0d0d0f}
.th-skel{min-height:70vh}
.th-bg{position:absolute;inset:0;z-index:0}
.th-bg img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.th-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,13,15,.92) 0%,rgba(13,13,15,.55) 42%,rgba(13,13,15,.08) 78%),linear-gradient(0deg,var(--bg) 0%,rgba(13,13,15,0) 40%),linear-gradient(180deg,rgba(13,13,15,.55),transparent 22%)}
.th>*:not(.th-bg):not(.th-back){position:relative;z-index:1}
.th-back{position:absolute;top:14px;left:var(--pad);z-index:60;width:46px;height:46px;border-radius:50%;background:rgba(16,16,18,.7);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);display:grid;place-items:center}
.th-back:hover{background:rgba(50,50,56,.8)}
.th-main{max-width:min(620px,100%)}
.th-h{margin:0;line-height:1;font-weight:800}
.th-logo{max-height:150px;max-width:min(420px,80vw);width:auto;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 24px rgba(0,0,0,.5))}
.th-title{display:block;font-size:clamp(38px,5.4vw,76px);line-height:1.02}
.th-gen{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:16px;font-size:14.5px;font-weight:500}
.th-gen span+span::before{content:"•";margin:0 9px;color:var(--mute)}
.th-btns{display:flex;gap:12px;align-items:center;margin-top:18px}
.circ{width:48px;height:48px;border-radius:50%;background:rgba(20,20,22,.7);border:1px solid var(--line);backdrop-filter:blur(8px);display:grid;place-items:center}
.circ:hover{background:rgba(60,60,66,.8)}
.circ svg{width:20px;height:20px;fill:#fff}
.th-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:22px;font-size:15px;color:#d6d6da}
.th-meta .star{color:#f5c518;font-weight:600}
.th-meta .dot{color:var(--mute)}
.cert{border:1px solid #777;border-radius:4px;padding:0 6px;font-size:12.5px;line-height:18px;color:#ddd}
.th-line{margin-top:14px;font-size:14.5px;line-height:1.45}
.th-line i{font-style:normal;color:var(--mute);margin-right:10px}
.th-ov{margin-top:18px;line-height:1.6;color:#e1e1e5;font-size:15px;max-width:56ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.th-ov.open{display:block;-webkit-line-clamp:unset}
.th-more{margin-top:6px;font-weight:600;font-size:14px}
.th-more[hidden]{display:none}
.th-card{flex:none;width:300px;padding:6px 16px;border-radius:14px;background:rgba(14,14,16,.7);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);align-self:flex-end}
.th-card div{display:flex;justify-content:space-between;gap:18px;padding:9px 0;font-size:13px}
.th-card span{color:var(--mute)}
.th-card b{font-weight:600;text-align:right}
#secs{position:relative;z-index:2;padding-top:10px}
#secs .row-head h2,.about h2{font-size:clamp(20px,1.7vw,26px);font-weight:700}
.pc{flex:0 0 112px;text-align:center;font-size:13px}
.pc img,.pc .ph0{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#222;margin:0 auto 10px}
.pc b{display:block;font-weight:600;line-height:1.25}
.pc small{display:block;color:var(--mute);margin-top:3px;line-height:1.25}
.row.wrap .track{flex-wrap:wrap;overflow:visible;row-gap:26px}
.row.wrap .arrow{display:none!important}
.chipbtn{margin:10px var(--pad) 0;padding:9px 18px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.chipbtn:hover{border-color:#555}
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px 28px;margin:0 var(--pad) 44px;padding-top:26px;border-top:1px solid var(--line)}
.crew small{display:block;color:var(--mute);font-size:12.5px;margin-bottom:4px}
.crew b{font-weight:500;font-size:14.5px;line-height:1.35}
.ptabs{display:flex;gap:8px;padding:0 var(--pad);margin-bottom:14px}
.ptabs button{padding:8px 18px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:#cfcfd4}
.ptabs button.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.pimg{flex:none;height:clamp(150px,14vw,240px);border-radius:12px;overflow:hidden;background:#1b1b1f;scroll-snap-align:start;cursor:zoom-in}
.pimg img{height:100%;width:100%;object-fit:cover;transition:transform .35s}
.pimg:hover img{transform:scale(1.04)}
.about{padding:20px var(--pad) 30px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 24px;margin-top:22px;max-width:980px}
.facts small{display:block;color:var(--mute);font-size:13px;margin-bottom:5px}
.facts b{font-weight:500;font-size:15px;line-height:1.4}
.clogos{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:24px}
.clogo{height:26px;max-width:120px;object-fit:contain;filter:brightness(0) invert(1);opacity:.7}
.kws{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
.kws span{padding:7px 15px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;color:#d6d6da}
.tov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);display:grid;place-items:center;padding:4vh 4vw;overflow:auto}
.tov-in{width:min(1280px,100%);max-height:100%}
.tov-in .player{max-width:none;margin:0}
.tov-x{position:fixed;top:16px;right:20px;width:46px;height:46px;border-radius:50%;background:rgba(30,30,34,.9);border:1px solid var(--line);font-size:28px;line-height:1;z-index:2}
.tov .eps{margin:0 0 12px;display:flex;gap:10px;flex-wrap:wrap}
.tov.lb .tov-in{display:grid;place-items:center}
.lbimg{max-width:100%;max-height:88vh;border-radius:12px;object-fit:contain}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:300}
@media (max-width:900px){
  .th{flex-direction:column;align-items:flex-start;justify-content:flex-end;padding-top:110px;min-height:auto;gap:26px}
  .th-card{width:100%;align-self:stretch}
}

/* ---------- person page ---------- */
.pp{position:relative;padding:0 0 20px}
.pp-head{position:relative;display:flex;gap:30px;align-items:flex-start;padding:100px var(--pad) 40px;overflow:hidden;min-height:340px}
.pp-bg{position:absolute;inset:0;z-index:0}
.pp-bg img{width:100%;height:100%;object-fit:cover;filter:blur(36px) brightness(.4) saturate(.9);transform:scale(1.25)}
.pp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(13,13,15,0) 55%)}
.pp-head>*:not(.pp-bg):not(.th-back){position:relative;z-index:1}
.pp-pic{flex:none;width:170px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#1b1b1f;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pp-pic img{width:100%;height:100%;object-fit:cover}
.pp-info{min-width:0;flex:1}
.pp-info h1{font-size:clamp(30px,3.6vw,48px);font-weight:800;line-height:1.05}
.pp-sub{margin-top:8px;color:var(--mute);font-size:13.5px}
.pp-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pp-links a{padding:5px 14px;border-radius:999px;background:rgba(20,20,22,.7);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.pp-links a:hover{border-color:#666}
.pp-bio{margin-top:16px;max-width:130ch;line-height:1.55;font-size:14.5px;color:#e1e1e5;max-height:6.2em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
.pp-bio p+p{margin-top:10px}
.pp-bio.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.ppsec{padding:20px var(--pad) 10px}
.ppsec h2{font-size:clamp(20px,1.7vw,26px);font-weight:700;margin-bottom:12px}
.crl{border-top:1px solid var(--line)}
.cr{display:grid;grid-template-columns:70px minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:baseline;padding:11px 6px;border-bottom:1px solid var(--line);font-size:14.5px}
.cr:hover{background:rgba(255,255,255,.04)}
.cr b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cy,.cc{color:var(--mute);font-size:13px}
.plink:hover{text-decoration:underline}
a.pc{display:block}
a.pc:hover b{text-decoration:underline}
@media (max-width:700px){
  .pp-head{flex-direction:column;padding-top:100px}
  .pp-pic{width:130px}
  .cr{grid-template-columns:54px minmax(0,1fr)}
  .cr .cc{grid-column:2}
}

/* ---------- episodes row on title page ---------- */
.ep-sec{padding:10px 0 34px}
.ep-card{flex:0 0 clamp(260px,22vw,360px);min-width:0;scroll-snap-align:start;display:block}
.ep-thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#1b1b1f}
.ep-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.ep-card:hover .ep-thumb img{transform:scale(1.04)}
.ep-badge{position:absolute;top:8px;left:8px;background:rgba(10,10,12,.85);padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700;z-index:3}
.ep-card h3{font-size:16px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-meta{font-size:13px;color:var(--mute);margin-top:4px}
.ep-ov{font-size:13.5px;color:#c4c4ca;margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- watch page ---------- */
.watch-page{padding:84px var(--pad) 60px}
.watch-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;max-width:1600px;margin:0 auto}
.watch-wrap.movie-mode{grid-template-columns:1fr;max-width:1280px}
.watch-player{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.watch-player iframe{width:100%;height:100%;border:0;display:block}
.watch-info{margin-top:20px}
.watch-title{font-size:clamp(24px,2.6vw,36px);font-weight:800;line-height:1.15}
.watch-title a:hover{text-decoration:underline}
.watch-sub{font-size:clamp(16px,1.4vw,20px);color:#d0d0d5;margin-top:8px;font-weight:600}

.watch-sim .row-head{padding:0 0 14px}

/* watch sidebar */
.watch-sidebar{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 110px);position:sticky;top:84px}
.sb-head{position:relative;z-index:20;padding:12px 14px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(20,20,24,.8)}
.sb-nav{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.sb-nav-btn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;line-height:1;cursor:pointer}
.sb-nav-btn:hover:not(:disabled){background:rgba(255,255,255,.15);color:#fff}
.sb-nav-btn:disabled{opacity:.35;cursor:default}
.sb-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.sb-item{display:flex;gap:12px;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;text-align:left;transition:background .15s}
.sb-item:hover{background:rgba(255,255,255,.05)}
.sb-item.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.sb-thumb{width:116px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#222;position:relative;flex-shrink:0}
.sb-thumb img{width:100%;height:100%;object-fit:cover}
.sb-badge{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;color:#eee}
.sb-text{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.sb-ep-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.sb-ep-sub{font-size:12px;color:var(--mute);margin-top:3px}
.sb-playing{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}

@media (max-width:1100px){
  .watch-wrap{grid-template-columns:1fr}
  .watch-sidebar{position:static;max-height:480px;margin-top:20px}
}
@media (max-width:760px){
  .watch-page{padding:calc(70px + env(safe-area-inset-top,0px)) var(--pad) 40px}

}

dialog{border:1px solid var(--line);background:var(--bg2);color:#fff;border-radius:18px;padding:0;width:min(640px,92vw);overflow:hidden}

.foot{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.foot-l .brand{padding:0;margin-bottom:10px;color:#fff}
.foot-l p{max-width:72ch}
.foot-r{display:flex;gap:22px;flex-wrap:wrap}
.foot-r a{color:#d6d6da;font-size:14px}
.foot-r a:hover{color:#fff}
.err{padding:140px var(--pad);color:var(--mute)}

/* ---------- ranked cards, browse-all, discover ---------- */
.rank{position:absolute;top:8px;left:8px;z-index:3;min-width:34px;height:34px;padding:0 9px;border-radius:9px;background:rgba(10,10,12,.85);display:grid;place-items:center;font-weight:700;font-size:16px}

.dd{position:relative}

.dd.open .ddm{display:block}
.ddm a, .ddm button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;font:inherit;font-size:14px;color:#d6d6da;background:none;border:0;cursor:pointer}
.ddm a:hover, .ddm button:hover{background:rgba(255,255,255,.07);color:#fff}
.ddm a[aria-selected="true"], .ddm button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}

/* custom minimalist season selector dropdown */
.dd.season-dd .ddb{
  height:38px;padding:0 16px 0 18px;border-radius:999px;
  background:rgba(26,26,30,.85);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:14px;font-weight:600;color:#fff;gap:10px;
}
.dd.season-dd .ddb:hover{background:rgba(45,45,52,.9);border-color:rgba(255,255,255,.25)}
.dd.season-dd .ddb svg{width:15px;height:15px;margin-top:1px}
.dd.season-dd .ddm{min-width:170px;background:#141418;border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.7);border-radius:14px}
.watch-sidebar .dd.season-dd .ddm{left:0;right:auto}

/* ---------- account menu & utilities ---------- */
.pop a svg{width:18px;height:18px;fill:currentColor;flex:none}
.no-zoom .card:hover .thumb img{transform:none}

/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:190px minmax(0,1fr);gap:36px;max-width:1080px;margin:0 auto;padding:110px var(--pad) 60px}
.set-nav{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:4px}
.set-nav a{padding:10px 18px;border-radius:999px;font-size:15px;color:var(--mute)}
.set-nav a:hover{color:#fff}
.set-nav a.on{background:#fff;color:#000;font-weight:600}
.set-main section{scroll-margin-top:96px;margin-bottom:30px}
.sh{font-size:14px;font-weight:500;color:var(--mute);margin:0 0 10px 4px}
.sg{background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sr{padding:18px 20px;border-top:1px solid var(--line)}
.sr:first-child{border-top:0}
.sr h3{font-size:16px;font-weight:500}
.sr p,.hint{color:var(--mute);font-size:13.5px;line-height:1.5;margin-top:4px}
.sr.tog{display:flex;align-items:center;justify-content:space-between;gap:20px}
.sw{flex:none;width:48px;height:28px;border-radius:999px;background:#2c2c32;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#9a9aa3;transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:#fff}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:#0d0d0f}
.pv{aspect-ratio:16/9;max-width:460px;border-radius:12px;overflow:hidden;background:#000}
.pv iframe{width:100%;height:100%;border:0;display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-top:14px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;background:#1b1b1f;border:1px solid var(--line);color:#fff}
.opt:hover{border-color:#555}
.opt b{display:block;font-weight:500;font-size:15px}
.opt small{display:block;margin-top:3px;color:var(--mute);font-size:12.5px;line-height:1.35}
.opt.on{background:#fff;color:#000;border-color:#fff}
.opt.on small{color:#555}
.crow{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.crow>span{width:64px;color:#d0d0d5;font-size:14px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.cs{width:30px;height:30px;border-radius:50%;border:2px solid #3a3a40;position:relative;flex:none}

.cs input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.keyf{display:flex;gap:10px;margin-top:12px}
.keyf input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:#0d0d0f;color:#fff;padding:0 14px;font:inherit;font-size:15px}
.pill{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;font-size:14.5px;font-weight:500;flex:none}
.pill:hover{background:rgba(255,255,255,.07)}
.pill.solid{background:#fff;color:#000;border-color:#fff}
.pill.solid:hover{background:#e6e6e8}

/* ---------- bottom tab bar (phones only) ---------- */
.bar{display:none}

/* ---------- responsive ---------- */
.track{overscroll-behavior-x:contain}

@media (max-width:1000px){

}

  .nav a.tab,.sep{display:none}
  .icon{width:44px;height:44px}
  .nav.searching .brand{display:none}
  .nav.searching #q{flex:1;width:auto;min-width:0;font-size:16px}
  .pos{position:static}
  .pop{top:calc(100% + 8px);left:0;right:0;width:auto;max-width:none}

  .bar{
    display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    background:rgba(16,16,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  .bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:11px;font-weight:500;color:var(--mute)}
  .bar svg{width:22px;height:22px;fill:currentColor}
  .bar a.on{color:#fff}
  .bar a.on svg{color:var(--accent)}

  /* hero: copy sits at the bottom, swipe to change slide */
  .hero{height:72vh;height:72svh;min-height:440px;max-height:640px;touch-action:pan-y}
  .slide::after{background:linear-gradient(90deg,rgba(13,13,15,.5),transparent 70%)}
  .slide>img.bg{object-position:62% 20%}
  .hero-copy{top:auto;bottom:80px;left:var(--pad);right:var(--pad);max-width:none;transform:none}
  .hero-copy .logo{max-height:84px}
  .hero-meta{margin-top:10px;font-size:14px}
  .hero-ov{font-size:14px;-webkit-line-clamp:2}
  .btns{margin-top:16px}
  .btn{height:44px;padding:0 20px;font-size:15px}
  .dots{right:auto;left:var(--pad);bottom:40px}
  .down{display:none}

  /* rows: one big card with the next one peeking in */
  .rows{margin-top:0}
  .row{padding-bottom:24px}
  .track{gap:12px}
  .track .card{flex-basis:clamp(230px,66vw,320px)}
  .card h3{font-size:15px;margin-top:10px}
  .card p{font-size:13px}

  /* browse / search pages */
  .page{padding:calc(76px + env(safe-area-inset-top,0px)) var(--pad) 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 12px}

  /* title page: full-width player, single column */
  .tp{padding:calc(68px + env(safe-area-inset-top,0px)) var(--pad) 24px}
  .player{max-width:none;margin:0 calc(var(--pad) * -1);border-radius:0}
  .eps select{flex:1;min-width:0;font-size:16px}
  .ov{font-size:15px}

  /* modal becomes a bottom sheet */
  dialog{width:100%;max-width:none;max-height:90vh;max-height:90svh;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0;overflow-y:auto}

  /* settings: section links become a scrolling strip */
  .set{grid-template-columns:1fr;gap:0;padding:calc(76px + env(safe-area-inset-top,0px)) var(--pad) 40px}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;margin:0 calc(var(--pad) * -1) 18px;padding:0 var(--pad);scrollbar-width:none}

  .set-nav a{flex:none;border:1px solid var(--line)}
  .set-nav a.on{border-color:#fff}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .sr{padding:16px}
  .crow>span{width:100%}
  .keyf{flex-direction:column}
  .keyf input{font-size:16px}

  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
  .ddb{width:100%;justify-content:space-between}
  .ddm{min-width:100%}
  .dd.r .ddm{left:auto;right:0}
  .browse-all{padding-bottom:28px}

  .setup{padding:16px}
  .setup input{font-size:16px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

function loadSettings() {

  if (!PLAYERS.some(p => p.id === st.player)) st.player = DEFAULTS.player;
  delete st.secondary;
  for (const k of ["primary", "icon"]) if (!HEX.test(st[k])) st[k] = DEFAULTS[k];
  for (const k of ["autoplay", "heroRotate", "hoverZoom", "titledThumbs"]) st[k] = !!st[k];
  return st;
}

    document.documentElement.style.setProperty("--accent", "#" + settings.primary);

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("#app");

};

/* =====================================================================
   TMDB
   ===================================================================== */
const cache = new Map();
const getKey = () => (CONFIG.TMDB_KEY || localStorage.getItem("sf_tmdb_key") || "").trim();

async function decryptKey(password) {
  const b = CONFIG.ENC_KEY, te = new TextEncoder();
  const from = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: from(b.salt), iterations: 600000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: from(b.iv) }, k, from(b.ct));
  return new TextDecoder().decode(pt);   // throws if the password is wrong
}

async function tmdb(path, params = {}) {
  const key = getKey();
  if (!key) throw new Error("NO_KEY");
  const url = new URL("https://api.themoviedb.org/3" + path);
  const headers = {};
  if (key.length > 40) headers.Authorization = "Bearer " + key; else url.searchParams.set("api_key", key);
  for (const [k, v] of Object.entries(params)) if (v !== "" && v != null) url.searchParams.set(k, v);
  const ck = url.pathname + url.search;
  if (cache.has(ck)) return cache.get(ck);
  const p = fetch(url, { headers }).then(r => {
    if (r.status === 401) throw new Error("BAD_KEY");
    if (!r.ok) throw new Error("TMDB " + r.status);
    return r.json();
  });
  cache.set(ck, p);
  p.catch(() => cache.delete(ck));
  return p;
}

/* =====================================================================
   building blocks
   ===================================================================== */
const enBackdropCache = new Map();

async function fetchEnBackdrop(type, id) {
  const key = `${type}_${id}`;
  if (enBackdropCache.has(key)) return enBackdropCache.get(key);
  const p = tmdb(`/${type}/${id}/images`, { include_image_language: "en" })
    .then(r => {
      const en = (r.backdrops || []).find(b => b.iso_639_1 === "en");
      return en ? en.file_path : null;
    })
    .catch(() => null);
  enBackdropCache.set(key, p);
  return p;
}

const seasonCache = new Map();
async function fetchSeason(tvId, seasonNum) {
  const k = `${tvId}_s${seasonNum}`;
  if (seasonCache.has(k)) return seasonCache.get(k);
  const p = tmdb(`/tv/${tvId}/season/${seasonNum}`).catch(() => ({ episodes: [] }));
  seasonCache.set(k, p);
  return p;
}

let thumbObserver = null;
function observeCardThumbs(container = document) {
  if (!settings.titledThumbs) return;
  if (!thumbObserver) {
    thumbObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          obs.unobserve(img);
          const type = img.dataset.type, id = img.dataset.tid;
          if (type && id) {
            fetchEnBackdrop(type, id).then(enPath => {
              if (enPath && img.isConnected) {
                const pre = new Image();
                pre.onload = () => { if (img.isConnected) img.src = IMG(enPath, "w1280"); };
                pre.src = IMG(enPath, "w1280");
              }
            });
          }
        }
      });
    }, { rootMargin: "300px" });
  }
  $$("img[data-tid]", container).forEach(img => thumbObserver.observe(img));
}

function card(it, type, opts = {}) {
  const t = type || it.media_type || kind(it);
  const name = it.title || it.name;
  const img = IMG(it.backdrop_path || it.poster_path, "w1280");
  const score = it.vote_average ? it.vote_average.toFixed(1) : "–";
  return `<a class="card" href="#title/${t}/${it.id}">
    <div class="thumb">${opts.rank ? `<span class="rank">${opts.rank}</span>` : ""}<img loading="lazy" src="${img}" alt="${esc(name)}" data-tid="${it.id}" data-type="${t}"><span class="play-overlay" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></span></div>
    <h3>${esc(name)}</h3>
    <p>★ ${score} · ${t === "tv" ? "Series" : "Movie"} · ${yr(it)}</p>
  </a>`;
}

function skeleton() {
  return Array.from({ length: 6 }, () => '<div class="card skel"><div class="thumb"></div><h3>&nbsp;</h3></div>').join("");
}

function makeRow(title, { viewAll } = {}) {
  const sec = document.createElement("section");
  sec.className = "row";
  sec.innerHTML = `<div class="row-head"><h2>${esc(title)}</h2>${viewAll ? `<a href="${viewAll}">View all</a>` : ""}</div>
    <button class="arrow l" aria-label="Scroll left">${ico.chev}</button>
    <div class="track">${skeleton()}</div>
    <button class="arrow r" aria-label="Scroll right">${ico.chev}</button>`;
  const tr = $(".track", sec);
  tr.addEventListener("scroll", () => sec.classList.toggle("has-left", tr.scrollLeft > 1), { passive: true });
  $(".arrow.l", sec).onclick = () => tr.scrollBy({ left: -tr.clientWidth * .85, behavior: "smooth" });
  $(".arrow.r", sec).onclick = () => tr.scrollBy({ left: tr.clientWidth * .85, behavior: "smooth" });
  return sec;
}

function fillRow(sec, promise, type, opts) {
  promise.then(items => {
    items = items.filter(hasImg);
    if (!items.length) { sec.remove(); return; }
    $(".track", sec).innerHTML = items.map((i, n) => card(i, type || undefined, { ...opts, rank: opts?.ranked ? n + 1 : 0 })).join("");
    observeCardThumbs(sec);
  }).catch(() => sec.remove());
}

function setActive(p) {
  $$("[data-p]").forEach(a => {
    const on = a.dataset.p === p;
    a.classList.toggle("on", on);
    if (on) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

function showError(e) {
  if (e.message === "NO_KEY" || e.message === "BAD_KEY") return setup(e.message === "BAD_KEY");
  app.innerHTML = `<div class="err"><h2>Something went wrong</h2><p>${esc(e.message)}. Check your connection and try again.</p></div>`;
}

function loginScreen(bad) {
  app.innerHTML = `<div class="setup"><form id="lf">
    <h1>Log in</h1>
    <p>${bad ? "Wrong password. Try again." : "Enter your password to unlock the site."}</p>
    <input id="lpw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button class="btn red" type="submit">Log in</button>
    <small>Stays unlocked in this browser.</small>
  </form></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#lf button"); btn.disabled = true; btn.textContent = "Unlocking…";

      localStorage.setItem("sf_tmdb_key", k);

}

function setup(bad) {

    <button class="btn red" type="submit">Save and continue</button>
    <small>Your API key is saved locally in this browser.</small>
  </form></div>`;
  $("#kf").onsubmit = e => {
    e.preventDefault();
    localStorage.setItem("sf_tmdb_key", $("#kin").value.trim());

let token = 0, heroTimer;

/* ---- home ---- */
async function home() {
  const my = ++token;
  app.innerHTML = `<div class="hero" id="hero"></div><div class="rows" id="rows"></div>`;
  const rows = $("#rows");
  const add = (title, promise, o = {}) => { const s = makeRow(title, o); rows.appendChild(s); fillRow(s, promise, o.type, o); return s; };

  const type = (arr, t) => arr.map(x => ({ ...x, media_type: t }));
  const rd = p => p.then(d => d.results);

  add("Popular movies", rd(tmdb("/movie/popular")), { type: "movie", viewAll: "#movies" });
  add("New this week", Promise.all([
    rd(tmdb("/discover/movie", { "primary_release_date.gte": daysAgo(7), "primary_release_date.lte": iso(new Date()), sort_by: "popularity.desc" })).then(r => type(r, "movie")),
    rd(tmdb("/discover/tv", { "first_air_date.gte": daysAgo(7), "first_air_date.lte": iso(new Date()), sort_by: "popularity.desc" })).then(r => type(r, "tv")),
  ]).then(([m, t]) => [...m, ...t].sort((a, b) => b.popularity - a.popularity).slice(0, 18)));
  add("New in 4K", uhdList(1), { type: "movie", viewAll: "#4k" });
  add("Trending series", rd(tmdb("/trending/tv/week")), { type: "tv", viewAll: "#series" });
  add("Top rated movies", rd(tmdb("/movie/top_rated")), { type: "movie" });

  try {
    const d = await tmdb("/trending/all/day");
    if (my !== token) return;
    const candidates = d.results.filter(x => hasImg(x) && x.media_type !== "person" && (x.vote_count || 0) >= 80);
    const list = candidates.length >= 4 ? candidates : d.results.filter(x => hasImg(x) && x.media_type !== "person" && (x.vote_count || 0) >= 20);
    buildHero(list.slice(0, 6));
  } catch (e) { if (my === token) showError(e); }
}

async function uhdList(page) {
  if (CONFIG.UHD_MOVIE_IDS.length) {
    const ids = CONFIG.UHD_MOVIE_IDS.slice((page - 1) * 20, page * 20);
    return Promise.all(ids.map(id => tmdb("/movie/" + id).catch(() => null))).then(r => r.filter(Boolean));
  }
  const d = await tmdb("/discover/movie", { sort_by: "popularity.desc", "primary_release_date.gte": daysAgo(730), "primary_release_date.lte": iso(new Date()), "vote_count.gte": 20, page });
  return d.results;
}

/* ---- hero: featured titles without trailer playback ---- */
async function buildHero(items) {
  const hero = $("#hero");
  if (!hero || !items.length) return;
  const multi = items.length > 1;
  const logos = await Promise.all(items.map(it =>
    tmdb(`/${it.media_type}/${it.id}/images`, { include_image_language: "en,null" })
      .then(r => (r.logos || []).find(l => l.iso_639_1 === "en") || (r.logos || [])[0]).catch(() => null)));
  if (!hero.isConnected) return;
  hero.innerHTML = items.map((it, i) => {
    const t = it.media_type, name = it.title || it.name;
    return `<div class="slide ${i === 0 ? "on" : ""}">
      <img class="bg" src="${IMG(it.backdrop_path, "original")}" alt="" ${i ? 'loading="lazy"' : ""}>
      <div class="hero-copy">
        ${logos[i] ? `<img class="logo" src="${IMG(logos[i].file_path, "original")}" alt="${esc(name)}">` : `<div class="ttl">${esc(name)}</div>`}
        <div class="hero-meta">★ ${it.vote_average.toFixed(1)} · ${t === "tv" ? "Series" : "Movie"} · ${yr(it)}</div>
        <p class="hero-ov">${esc(it.overview)}</p>
        <div class="btns">
          <a class="btn light" href="#watch/${t}/${it.id}">${ico.play} Play</a>
          <button class="btn dark" data-info="${i}">${ico.info} Info</button>
          </div>
      </div></div>`;
  }).join("") + (multi ? `<div class="dots">${items.map((_, i) => `<button aria-label="Slide ${i + 1}" class="${i === 0 ? "on" : ""}"></button>`).join("")}</div>` : "") +
    `<button class="down" aria-label="Browse titles">${ico.chev}</button>`;

  let cur = 0, prev = -1, transTimer = null;
  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const go = n => {
    prev = cur;
    cur = (n + items.length) % items.length;
    const slides = $$(".slide", hero);
    slides.forEach((sl, i) => {
      sl.classList.remove("prev");
      if (i === cur) {
        sl.classList.add("on");
      } else if (i === prev) {
        sl.classList.add("prev");
        sl.classList.remove("on");
      } else {
        sl.classList.remove("on");
      }
    });
    clearTimeout(transTimer);
    transTimer = setTimeout(() => {
      slides.forEach((sl, i) => {
        if (i !== cur) sl.classList.remove("prev", "on");
      });
    }, 800);
    $$(".dots button", hero).forEach((b, i) => {
      const on = i === cur;
      b.classList.toggle("on", on);
      b.setAttribute("aria-current", on ? "true" : "false");
    });
  };
  const restart = () => {
    clearInterval(heroTimer);
    if (multi && settings.heroRotate && !prefersReduced) heroTimer = setInterval(() => go(cur + 1), 9000);
  };
  const pause = () => clearInterval(heroTimer);

  hero.addEventListener("mouseenter", pause);
  hero.addEventListener("mouseleave", restart);
  hero.addEventListener("focusin", pause);
  hero.addEventListener("focusout", restart);

  $$(".dots button", hero).forEach((b, i) => b.onclick = () => { go(i); restart(); });
  $(".down", hero).onclick = () => $("#rows").scrollIntoView({ behavior: "smooth" });
  hero.addEventListener("click", e => {
    const inf = e.target.closest("[data-info]");
    if (inf) openInfo(items[+inf.dataset.info]);
  });

  go(0);
  restart();

  if (multi) {   // swipe left / right on touch screens
    let sx = null, sy = 0;
    hero.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    hero.addEventListener("touchend", e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { go(cur + (dx < 0 ? 1 : -1)); restart(); }
    }, { passive: true });
  }
}

function openInfo(it) {
  const t = it.media_type || kind(it), dlg = $("#dlg");
  const lastActive = document.activeElement;
  dlg.setAttribute("aria-labelledby", "dlg-title");
  dlg.innerHTML = `<button class="icon x" aria-label="Close" onclick="this.closest('dialog').close()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" fill="none"/></svg></button>
    <img class="m-img" src="${IMG(it.backdrop_path, "w780")}" alt="">
    <div class="m-body"><h3 id="dlg-title">${esc(it.title || it.name)}</h3>
    <div class="meta"><span>★ ${it.vote_average.toFixed(1)}</span><span>${t === "tv" ? "Series" : "Movie"}</span><span>${yr(it)}</span></div>
    <p class="ov">${esc(it.overview)}</p>
    <div class="btns"><a class="btn red" href="#watch/${t}/${it.id}" onclick="document.getElementById('dlg').close()">${ico.play} Watch now</a></div></div>`;
  dlg.showModal();
  dlg.querySelector(".x")?.focus();
  dlg.addEventListener("close", () => { if (lastActive && typeof lastActive.focus === "function") lastActive.focus(); }, { once: true });
}
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });

/* ---- grid pages (movies / series / 4k / search) ---- */
async function gridPage({ title, head = "", hideTitle = false, fetchPage, type }) {
  const my = ++token;
  app.innerHTML = `<div class="page"><h1 class="ph${hideTitle ? " vh" : ""}">${esc(title)}</h1>${head}<div class="grid" id="grid">${skeleton()}</div><button class="more" id="more" hidden>Load more</button></div>`;
  const grid = $("#grid"), more = $("#more");
  let page = 1, first = true;
  const load = async () => {
    more.disabled = true;
    try {
      const { items, hasMore } = await fetchPage(page);
      if (my !== token) return;
      if (first) { grid.innerHTML = ""; first = false; }
      const html = items.filter(hasImg).map(i => card(i, type || undefined)).join("");
      grid.insertAdjacentHTML("beforeend", html);
      observeCardThumbs(grid);
      if (!grid.children.length) grid.innerHTML = '<p class="empty">Nothing found. Try different filters.</p>';
      more.hidden = !hasMore; page++;
    } catch (e) { if (my === token) showError(e); }
    more.disabled = false;
  };
  more.onclick = load;
  load();
}

/* ---- Movies / Series / 4K: one featured title, a Top 10, then a row per genre ---- */
const SKIP_GENRES = new Set([10770, 10767, 10763, 10766]);   // TV Movie, Talk, News, Soap

function lazy(sec, loader, type, opts) {
  const io = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting)) { io.disconnect(); fillRow(sec, loader(), type, opts); }
  }, { rootMargin: "500px" });
  io.observe(sec);
}

async function featuredPage(kind) {
  const my = ++token;
  const uhd = kind === "uhd", type = kind === "tv" ? "tv" : "movie", label = type === "tv" ? "series" : "movies";
  app.innerHTML = `<div class="hero" id="hero"></div><div class="rows" id="rows"></div>
    <div class="browse-all"><a class="btn dark" href="#discover?type=${type}">Browse all ${label}</a></div>`;
  const rows = $("#rows");
  const rd = p => p.then(d => d.results);
  const add = (title, promise, o = {}) => { const sec = makeRow(title, o); rows.appendChild(sec); fillRow(sec, promise, type, o); };
  try {
    const rawTop = uhd ? await uhdList(1) : await rd(tmdb(`/trending/${type}/day`));
    if (my !== token) return;
    const top = rawTop.filter(hasImg);
    const pool = top.filter(x => x.backdrop_path && (uhd || (x.vote_count || 0) >= 60));
    const validPool = pool.length ? pool : top.filter(x => x.backdrop_path);
    if (validPool.length) buildHero([{ ...validPool[uhd ? 0 : Math.floor(Math.random() * Math.min(validPool.length, 5))], media_type: type }]);
    add(uhd ? "Top 10 in 4K" : `Top 10 ${label} today`, Promise.resolve(top.slice(0, 10)), { ranked: true });

    if (uhd && CONFIG.UHD_MOVIE_IDS.length) {
      add("More in 4K", uhdList(2).then(r => [...top.slice(10), ...r]));
      return;
    }
    const g = await tmdb(`/genre/${type}/list`);
    if (my !== token) return;
    const recent = uhd ? { "primary_release_date.gte": daysAgo(730), "primary_release_date.lte": iso(new Date()) } : {};
    for (const x of g.genres.filter(x => !SKIP_GENRES.has(x.id))) {
      const sec = makeRow(x.name, { viewAll: `#discover?type=${type}&genre=${x.id}` });
      rows.appendChild(sec);
      lazy(sec, () => rd(tmdb(`/discover/${type}`, { with_genres: x.id, sort_by: "popularity.desc", "vote_count.gte": 30, ...recent })), type);
    }
  } catch (e) { if (my === token) showError(e); }
}

/* ---- Discover: filter everything ---- */
const SORTS = [["popular", "Popular"], ["top", "Top rated"], ["new", "Newest"], ["az", "A–Z"]];

function dd(label, items, cur, cls = "") {
  const sel = items.find(i => i.v === cur) || items[0];
  return `<div class="dd ${cls}"><button class="ddb" aria-haspopup="listbox" aria-expanded="false">${esc(sel.label)}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div class="ddm" role="listbox" aria-label="${label}">${items.map(i => `<a role="option" href="${i.href}" aria-selected="${i.v === sel.v}">${esc(i.label)}</a>`).join("")}</div></div>`;
}

function seasonDropdown(seasons, curSeason, idPrefix = "sdd") {
  const cur = seasons.find(s => s.season_number === +curSeason) || seasons[0] || { season_number: 1, name: "Season 1" };
  return `<div class="dd season-dd" id="${idPrefix}">
    <button class="ddb" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="sdd-label">${esc(cur.name)}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
    </button>
    <div class="ddm" role="listbox" aria-label="Select season">
      ${seasons.map(s => `
        <button type="button" role="option" data-snum="${s.season_number}" aria-selected="${s.season_number === cur.season_number}">
          ${esc(s.name)}
        </button>
      `).join("")}
    </div>
  </div>`;
}

async function discoverPage(q) {
  const type = q.get("type") === "tv" ? "tv" : "movie";
  const sort = SORTS.some(x => x[0] === q.get("sort")) ? q.get("sort") : "popular";
  const genre = /^\d+$/.test(q.get("genre") || "") ? q.get("genre") : "";
  const year = /^\d{4}$/.test(q.get("year") || "") ? q.get("year") : "";
  const g = await tmdb(`/genre/${type}/list`);
  const href = o => {
    const n = { type, sort, genre, year, ...o }, p = new URLSearchParams({ type: n.type });
    if (n.sort !== "popular") p.set("sort", n.sort);
    if (n.genre) p.set("genre", n.genre);
    if (n.year) p.set("year", n.year);
    return "#discover?" + p;
  };
  const thisYear = new Date().getFullYear();
  const filters = `<div class="filters">` +
    dd("Sort by", SORTS.map(([v, label]) => ({ v, label, href: href({ sort: v }) })), sort) +
    dd("Type", [{ v: "movie", label: "Movies", href: href({ type: "movie", genre: "" }) }, { v: "tv", label: "Series", href: href({ type: "tv", genre: "" }) }], type, "r") +
    dd("Genre", [{ v: "", label: "All genres", href: href({ genre: "" }) }, ...g.genres.filter(x => !SKIP_GENRES.has(x.id)).map(x => ({ v: String(x.id), label: x.name, href: href({ genre: String(x.id) }) }))], genre) +
    dd("Year", [{ v: "", label: "All years", href: href({ year: "" }) }, ...Array.from({ length: thisYear - 1949 }, (_, i) => { const y = String(thisYear - i); return { v: y, label: y, href: href({ year: y }) }; })], year, "r") +
    `</div>`;
  setActive(type === "tv" ? "series" : "movies");
  document.title = `Discover · ${CONFIG.SITE_NAME}`;
  gridPage({
    title: "Discover", hideTitle: true, head: filters, type,
    fetchPage: async page => {
      const prm = { page, with_genres: genre, "vote_count.gte": 30 };
      const dateKey = type === "movie" ? "primary_release_date" : "first_air_date";
      if (sort === "popular") prm.sort_by = "popularity.desc";
      if (sort === "top") { prm.sort_by = "vote_average.desc"; prm["vote_count.gte"] = type === "movie" ? 500 : 200; }
      if (sort === "new") { prm.sort_by = dateKey + ".desc"; prm[dateKey + ".lte"] = iso(new Date()); prm["vote_count.gte"] = 10; }
      if (sort === "az") { prm.sort_by = type === "movie" ? "original_title.asc" : "name.asc"; prm["vote_count.gte"] = 200; }
      if (year) prm[type === "movie" ? "primary_release_year" : "first_air_date_year"] = year;
      const d = await tmdb(`/discover/${type}`, prm);
      return { items: d.results, hasMore: page < d.total_pages };
    },
  });
}

function searchPage(q) {
  if (!q) { location.hash = "#home"; return; }
  gridPage({
    title: `Results for “${q}”`,
    fetchPage: async page => {
      const d = await tmdb("/search/multi", { query: q, page });
      return { items: d.results.filter(r => r.media_type === "movie" || r.media_type === "tv"), hasMore: page < d.total_pages };
    },
  });
}

/* ---- title page ---- */
function embedSrc(type, id, s = 1, e = 1, over = {}) {
  const o = { ...settings, ...over };
  const base = (() => {
    const srv = SERVERS.find(sv => sv.id === o.server) || SERVERS.find(sv => sv.id === DEFAULTS.server);
    const tpl = type === "tv" ? srv.tv : srv.movie;
    if (!tpl) return (type === "tv" ? CONFIG.TV_EMBED : CONFIG.MOVIE_EMBED).replace("{id}", id).replace("{season}", s).replace("{episode}", e);
    return tpl.replace("{id}", id).replace("{season}", s).replace("{episode}", e);
  })();
  // "classic" is the player's plain look: it has no player= parameter at all.
  const q = [];
  if (o.player !== "classic") q.push(`player=${o.player}`);
  q.push(`primarycolor=${o.primary}`, `${CONFIG.ICON_PARAM}=${o.icon}`, `secondarycolor=${CONFIG.SURFACE_COLOR}`, `autoplay=${o.autoplay}`);
  return `${base}?${q.join("&")}`;
}
function iframe(type, id, name, s, e) {
  return `<iframe src="${esc(embedSrc(type, id, s, e))}" title="${esc(name)}" loading="lazy" style="width:100%;aspect-ratio:16/9;border:0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>`;
}

/* full-screen overlay used for the player, trailers and photos */
function closeOverlay() { const o = $(".tov"); if (o) o.remove(); document.body.style.overflow = ""; }
function openOverlay(html, cls = "") {
  closeOverlay();
  const o = document.createElement("div");
  o.className = "tov " + cls;
  o.innerHTML = `<div class="tov-in">${html}</div><button class="tov-x" aria-label="Close">×</button>`;
  o.addEventListener("click", e => { if (e.target === o || e.target.closest(".tov-x")) closeOverlay(); });
  document.body.appendChild(o);
  document.body.style.overflow = "hidden";
  return o;
}
addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });
addEventListener("hashchange", closeOverlay);

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

const fmtDate = s => {
  if (!s) return "";
  const dt = new Date(s + "T00:00:00");
  return isNaN(dt) ? s : dt.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
};
const uniqP = arr => { const seen = new Set(); return arr.filter(p => p && !seen.has(p.id) && seen.add(p.id)); };
const plinks = ps => ps.map(p => `<a class="plink" href="#person/${p.id}">${esc(p.name)}</a>`).join(", ");
const hm = m => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
const tIco = {
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 00-2.2 1l-6.7-3.9a3 3 0 000-2.2l6.6-3.9A3 3 0 1015 5a3 3 0 00.1.8L8.5 9.7a3 3 0 100 4.6l6.7 3.9A3 3 0 1018 16z"/></svg>',
};

async function titlePage(type, id) {
  if (!["movie", "tv"].includes(type) || !/^\d+$/.test(id || "")) return notFound();
  const my = ++token;
  app.innerHTML = '<div class="tp"><div class="th th-skel"></div></div>';
  const d = await tmdb(`/${type}/${id}`, {
    append_to_response: "credits,similar,images,keywords," + (type === "movie" ? "release_dates" : "content_ratings"),
    include_image_language: "en,null",
  });
  if (my !== token) return;

  const isTv = type === "tv";
  const name = d.title || d.name;
  document.title = `${name} · ${CONFIG.SITE_NAME}`;
  const date = d.release_date || d.first_air_date || "";
  const runtime = !isTv && d.runtime ? hm(d.runtime) : (isTv && d.number_of_seasons ? `${d.number_of_seasons} season${d.number_of_seasons > 1 ? "s" : ""}` : "");
  const endsAt = !isTv && d.runtime ? new Date(Date.now() + d.runtime * 60000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  const cast = d.credits?.cast || [];
  const crew = d.credits?.crew || [];
  const jobs = (...j) => uniqP(crew.filter(c => j.includes(c.job)));
  const directors = isTv ? uniqP(d.created_by || []) : jobs("Director");
  const seasons = (d.seasons || []).filter(s => s.season_number > 0);
  const lang = d.spoken_languages?.[0]?.english_name || (d.original_language || "").toUpperCase();
  const score = d.vote_average ? d.vote_average.toFixed(1) : "–";

  let cert = "";
  if (!isTv) {
    const r = (d.release_dates?.results || []).find(x => x.iso_3166_1 === "US");
    cert = (r?.release_dates || []).map(x => x.certification).find(Boolean) || "";
  } else cert = (d.content_ratings?.results || []).find(x => x.iso_3166_1 === "US")?.rating || "";

  const logos = d.images?.logos || [];
  const logo = logos.find(l => l.iso_639_1 === "en") || logos.find(l => !l.iso_639_1) || logos[0];

  app.innerHTML = `<div class="tp">
    <header class="th">
      <div class="th-bg"><img src="${IMG(d.backdrop_path || d.poster_path, "w1280")}" alt=""></div>
      <button class="th-back" id="backBtn" aria-label="Back">${tIco.back}</button>
      <div class="th-main">
        <h1 class="th-h">${logo ? `<img class="th-logo" src="${IMG(logo.file_path, "w500")}" alt="${esc(name)}">` : `<span class="th-title">${esc(name)}</span>`}</h1>
        <div class="th-gen">${(d.genres || []).map(g => `<span>${esc(g.name)}</span>`).join("")}</div>
        <div class="th-btns">
          <button class="btn light" id="playBtn">${ico.play}Play</button>
          <button class="circ" id="shBtn" title="Share" aria-label="Share">${tIco.share}</button>
        </div>
        <div class="th-meta">
          <span class="star">★ ${score}</span>
          ${yr(d) ? `<span class="dot">•</span><span>${yr(d)}</span>` : ""}
          ${runtime ? `<span class="dot">•</span><span>${runtime}</span>` : ""}
          ${cert ? `<span class="dot">•</span><span class="cert">${esc(cert)}</span>` : ""}
        </div>
        ${directors.length ? `<p class="th-line"><i>${isTv ? "Creator" : "Director"}</i>${plinks(directors.slice(0, 3))}</p>` : ""}
        ${cast.length ? `<p class="th-line"><i>Starring</i>${plinks(cast.slice(0, 4))}</p>` : ""}
        <p class="th-ov" id="ov">${esc(d.overview || "No description available.")}</p>
        <button class="th-more" id="moreBtn" hidden>Read more</button>
      </div>
      <aside class="th-card">
        <div><span>${isTv ? "Seasons" : "Runtime"}</span><b>${esc(runtime || "–")}${endsAt ? ` · ends ${esc(endsAt)}` : ""}</b></div>
        <div><span>Language</span><b>${esc(lang || "–")}</b></div>
        <div><span>${isTv ? "First aired" : "Released"}</span><b>${esc(fmtDate(date) || "–")}</b></div>
      </aside>
    </header>
    <div id="secs"></div>
  </div>`;

  /* hero behaviour */
  $("#backBtn").onclick = () => { if (history.length > 1) history.back(); else location.hash = "#home"; };
  const ov = $("#ov"), more = $("#moreBtn");
  if (ov.scrollHeight > ov.clientHeight + 2) more.hidden = false;
  more.onclick = () => { const o = ov.classList.toggle("open"); more.textContent = o ? "Show less" : "Read more"; };

  $("#shBtn").onclick = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: name, url: location.href }); return; }
      await navigator.clipboard.writeText(location.href); toast("Link copied");
    } catch { /* cancelled */ }
  };

  $("#playBtn").onclick = () => {
    location.hash = isTv ? `#watch/tv/${id}/1/1` : `#watch/movie/${id}`;
  };

  /* sections */
  const secs = $("#secs");

  if (isTv && seasons.length) {
    const s = makeRow("Episodes");
    s.classList.add("ep-sec");
    const rh = $(".row-head", s);
    rh.insertAdjacentHTML("beforeend", seasonDropdown(seasons, seasons[0].season_number, "tpSeasonDD"));
    secs.appendChild(s);

    const tpDD = $("#tpSeasonDD", s);
    if (tpDD) {
      tpDD.addEventListener("click", e => {
        const opt = e.target.closest("[data-snum]");
        if (!opt) return;
        const sNum = +opt.dataset.snum;
        $(".sdd-label", tpDD).textContent = opt.textContent.trim();
        $$("[data-snum]", tpDD).forEach(b => b.setAttribute("aria-selected", b === opt));
        tpDD.classList.remove("open");
        loadSeasonIntoRow(sNum);
      });
    }

    const loadSeasonIntoRow = async (sn) => {
      const tr = $(".track", s);
      tr.innerHTML = skeleton();
      const sData = await fetchSeason(id, sn);
      const eps = sData?.episodes || [];
      if (!eps.length) {
        tr.innerHTML = '<p class="empty" style="padding:20px var(--pad)">No episodes found for this season.</p>';
        return;
      }
      tr.innerHTML = eps.map(ep => `
        <a class="card ep-card" href="#watch/tv/${id}/${sn}/${ep.episode_number}">
          <div class="thumb ep-thumb">
            <img loading="lazy" src="${IMG(ep.still_path || d.backdrop_path, "w500")}" alt="${esc(ep.name)}">
            <span class="ep-badge">E${ep.episode_number}</span>
            <span class="play-overlay" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></span>
          </div>
          <h3>${ep.episode_number}. ${esc(ep.name)}</h3>
          <p class="ep-meta">${fmtDate(ep.air_date) || yr(d)}${ep.runtime ? ` · ${ep.runtime} min` : ""}</p>
          <p class="ep-ov">${esc(ep.overview || "No description available.")}</p>
        </a>
      `).join("");
      tr.scrollLeft = 0;
    };

    loadSeasonIntoRow(seasons[0].season_number);
  }

  if (cast.length) {
    const s = makeRow("Cast & crew");
    const render = all => {
      $(".track", s).innerHTML = cast.slice(0, all ? 60 : 16).map(c => `<a class="pc" href="#person/${c.id}">${c.profile_path ? `<img loading="lazy" src="${IMG(c.profile_path, "w185")}" alt="">` : '<div class="ph0"></div>'}<b>${esc(c.name)}</b><small>${esc(c.character || "")}</small></a>`).join("");
      s.classList.toggle("wrap", all);
    };
    render(false);
    if (cast.length > 16) {
      const b = document.createElement("button");
      b.className = "chipbtn"; b.textContent = "Show all";
      b.onclick = () => { const all = !s.classList.contains("wrap"); render(all); b.textContent = all ? "Show less" : "Show all"; };
      s.appendChild(b);
    }
    secs.appendChild(s);
  }

  const groups = [
    [isTv ? "Created by" : "Directed by", directors],
    ["Written by", jobs("Writer", "Screenplay", "Story", "Teleplay")],
    ["Based on", jobs("Novel", "Book", "Characters", "Comic Book")],
    ["Produced by", jobs("Producer")],
    ["Music by", jobs("Original Music Composer", "Music")],
    ["Edited by", jobs("Editor")],
  ].filter(g => g[1].length);
  if (groups.length) {
    const c = document.createElement("section");
    c.className = "crew";
    c.innerHTML = groups.map(([l, v]) => `<div><small>${l}</small><b>${plinks(v.slice(0, 3))}</b></div>`).join("");
    secs.appendChild(c);
  }

  const bd = d.images?.backdrops || [], ps = d.images?.posters || [];
  if (bd.length || ps.length) {
    const s = makeRow("Photos");
    const tabs = document.createElement("div");
    tabs.className = "ptabs";
    const sets = [["Backdrops", bd], ["Posters", ps]].filter(x => x[1].length);
    const show = list => {
      const tall = list === ps;
      $(".track", s).innerHTML = list.slice(0, 24).map(im => `<button class="pimg" style="aspect-ratio:${im.aspect_ratio || (tall ? .667 : 1.778)}" data-f="${esc(im.file_path)}" data-w="${tall ? "w780" : "w1280"}"><img loading="lazy" src="${IMG(im.file_path, tall ? "w342" : "w500")}" alt=""></button>`).join("");
      $(".track", s).scrollLeft = 0;
    };
    sets.forEach(([label, list], i) => {
      const b = document.createElement("button");
      b.textContent = label; if (!i) b.className = "on";
      b.onclick = () => { $$("button", tabs).forEach(x => x.classList.remove("on")); b.classList.add("on"); show(list); };
      tabs.appendChild(b);
    });
    $(".row-head", s).after(tabs);
    show(sets[0][1]);
    s.addEventListener("click", e => { const b = e.target.closest(".pimg"); if (b) openOverlay(`<img class="lbimg" src="${IMG(b.dataset.f, b.dataset.w)}" alt="">`, "lb"); });
    secs.appendChild(s);
  }

  const sim = (d.similar?.results || []).filter(hasImg);
  if (sim.length) {
    const s = makeRow("More like this");
    secs.appendChild(s);
    fillRow(s, Promise.resolve(sim), type);
  }

  /* about */
  const comps = d.production_companies || [];
  const countries = (d.production_countries || []).map(c => c.name);
  const kws = (isTv ? d.keywords?.results : d.keywords?.keywords) || [];
  const facts = [
    ["Status", d.status],
    [isTv ? "First aired" : "Released", fmtDate(date)],
    ["Genre", (d.genres || []).map(g => g.name).join(", ")],
    [isTv ? "Seasons" : "Runtime", runtime],
    isTv ? ["Episodes", d.number_of_episodes] : null,
    isTv ? ["Network", (d.networks || []).map(n => n.name).join(", ")] : null,
    ["Language", lang],
    ["Studio", comps.map(c => c.name).slice(0, 4).join(", ")],
    ["Country", countries.join(", ")],
  ].filter(f => f && f[1]);
  const about = document.createElement("section");
  about.className = "about";
  about.innerHTML = `<h2>About</h2>
    <div class="facts">${facts.map(([l, v]) => `<div><small>${l}</small><b>${esc(v)}</b></div>`).join("")}</div>
    ${comps.some(c => c.logo_path) ? `<div class="clogos">${comps.filter(c => c.logo_path).slice(0, 4).map(c => `<img class="clogo" src="${IMG(c.logo_path, "w185")}" alt="${esc(c.name)}">`).join("")}</div>` : ""}
    ${kws.length ? `<div class="kws">${kws.slice(0, 30).map(k => `<span>${esc(k.name)}</span>`).join("")}</div>` : ""}`;
  secs.appendChild(about);
}
