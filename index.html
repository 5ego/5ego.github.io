async function watchPage(type, id, sNum = 1, eNum = 1) {
  if (!["movie", "tv"].includes(type) || !/^\d+$/.test(id || "")) return notFound();
  const my = ++token;
  const isTv = type === "tv";
  let curSeason = Math.max(1, parseInt(sNum, 10) || 1);
  let curEpisode = Math.max(1, parseInt(eNum, 10) || 1);

  app.innerHTML = '<div class="watch-page"><div class="watch-wrap"><div class="watch-main"><div class="watch-player" style="aspect-ratio:16/9"></div></div></div></div>';

  const d = await tmdb(`/${type}/${id}`, { append_to_response: "similar" });
  if (my !== token) return;

  const showName = d.title || d.name;
  const seasons = isTv ? (d.seasons || []).filter(s => s.season_number > 0) : [];
  if (isTv && seasons.length && !seasons.some(s => s.season_number === curSeason)) {
    curSeason = seasons[0].season_number;
  }

  let seasonEpisodes = [];
  if (isTv) {
    const sData = await fetchSeason(id, curSeason);
    if (my !== token) return;
    seasonEpisodes = sData?.episodes || [];
  }

  const getCurEp = () => seasonEpisodes.find(ep => ep.episode_number === curEpisode) || seasonEpisodes[0] || {};
  let curEp = isTv ? getCurEp() : {};
  if (isTv && curEp.episode_number) curEpisode = curEp.episode_number;

  const getPageTitle = () => {
    if (!isTv) return `Watch ${showName} · ${CONFIG.SITE_NAME}`;
    return `Watch S${curSeason}:E${curEpisode} ${curEp.name ? "· " + curEp.name : ""} - ${showName} · ${CONFIG.SITE_NAME}`;
  };
  document.title = getPageTitle();

  const score = d.vote_average ? d.vote_average.toFixed(1) : "–";
  const date = d.release_date || d.first_air_date || "";

  app.innerHTML = `<div class="watch-page">
    <div class="watch-wrap ${!isTv ? "movie-mode" : ""}">
      <div class="watch-main">
        <div class="watch-player" id="watchPlayer">
          ${iframe(type, id, `${showName} ${isTv ? `S${curSeason}E${curEpisode}` : ""}`, curSeason, curEpisode)}
        </div>
        <div class="watch-info">
          <h1 class="watch-title"><a href="#title/${type}/${id}" title="View details">${esc(showName)}</a></h1>
          ${isTv ? `<div class="watch-sub" id="watchSub">S${curSeason}E${curEpisode}: ${esc(curEp.name || "Episode " + curEpisode)}</div>` : ""}
          <div class="watch-actions">
            <a class="pill" href="#title/${type}/${id}">${tIco.back} View details</a>
            <button class="pill" id="watchShareBtn">${tIco.share} Share</button>
          </div>
          <div class="watch-meta" id="watchMeta">
            <span class="star">★ ${score}</span>
            <span>•</span>
            <span>${fmtDate(date) || yr(d)}</span>
            ${isTv && curEp.runtime ? `<span>•</span><span>${curEp.runtime}m</span>` : (d.runtime ? `<span>•</span><span>${hm(d.runtime)}</span>` : "")}
          </div>
          <p class="watch-ov" id="watchOv">${esc(isTv ? (curEp.overview || d.overview || "No episode description available.") : (d.overview || "No description available."))}</p>
        </div>
        <div class="watch-sim" id="watchSim"></div>
      </div>

      ${isTv ? `
      <aside class="watch-sidebar">
        <div class="sb-head">
          ${seasonDropdown(seasons, curSeason, "watchSeasonDD")}
          <div class="sb-nav">
            <span id="sbEpCount">${curEpisode} / ${seasonEpisodes.length || 1}</span>
            <button class="sb-nav-btn" id="sbPrevBtn" title="Previous episode" aria-label="Previous episode">‹</button>
            <button class="sb-nav-btn" id="sbNextBtn" title="Next episode" aria-label="Next episode">›</button>
          </div>
        </div>
        <div class="sb-list" id="sbList"></div>
      </aside>
      ` : ""}
    </div>
  </div>`;

  // Share button
  $("#watchShareBtn").onclick = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: document.title, url: location.href }); return; }
      await navigator.clipboard.writeText(location.href); toast("Link copied");
    } catch {}
  };

  // Horizontal "More like this" under the episode description
  const sim = (d.similar?.results || []).filter(hasImg);
  if (sim.length) {
    const s = makeRow("More like this");
    $("#watchSim").appendChild(s);
    fillRow(s, Promise.resolve(sim), type);
  }

  if (!isTv) return;

  // TV Sidebar logic
  const renderSbList = () => {
    const sbList = $("#sbList");
    if (!sbList) return;
    if (!seasonEpisodes.length) {
      sbList.innerHTML = '<p class="empty" style="padding:16px;font-size:13px">No episodes found.</p>';
      return;
    }
    sbList.innerHTML = seasonEpisodes.map(ep => {
      const active = ep.episode_number === curEpisode;
      return `<button class="sb-item ${active ? "active" : ""}" data-ep="${ep.episode_number}">
        <div class="sb-thumb">
          <img loading="lazy" src="${IMG(ep.still_path || d.backdrop_path, "w300")}" alt="${esc(ep.name)}">
          <span class="sb-badge">${ep.runtime ? ep.runtime + "m" : ""}</span>
        </div>
        <div class="sb-text">
          <div class="sb-ep-title">${ep.episode_number}. ${esc(ep.name)}</div>
          ${active ? '<div class="sb-playing">Now playing</div>' : `<div class="sb-ep-sub">${fmtDate(ep.air_date) || yr(d)}</div>`}
        </div>
      </button>`;
    }).join("");

    const activeEl = $(".sb-item.active", sbList);
    if (activeEl) activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };

  const updateEpisode = (newEpNum) => {
    curEpisode = newEpNum;
    curEp = getCurEp();
    document.title = getPageTitle();

    const wp = $("#watchPlayer");
    if (wp) wp.innerHTML = iframe("tv", id, `${showName} S${curSeason}E${curEpisode}`, curSeason, curEpisode);

    const sub = $("#watchSub");
    if (sub) sub.textContent = `S${curSeason}E${curEpisode}: ${curEp.name || "Episode " + curEpisode}`;
    const ov = $("#watchOv");
    if (ov) ov.textContent = curEp.overview || d.overview || "No episode description available.";
    const count = $("#sbEpCount");
    if (count) count.textContent = `${curEpisode} / ${seasonEpisodes.length || 1}`;
    const meta = $("#watchMeta");
    if (meta) {
      meta.innerHTML = `<span class="star">★ ${score}</span><span>•</span><span>${fmtDate(curEp.air_date || date) || yr(d)}</span>${curEp.runtime ? `<span>•</span><span>${curEp.runtime}m</span>` : ""}`;
    }

    const prevBtn = $("#sbPrevBtn"), nextBtn = $("#sbNextBtn");
    const curIdx = seasonEpisodes.findIndex(ep => ep.episode_number === curEpisode);
    if (prevBtn) prevBtn.disabled = curIdx <= 0;
    if (nextBtn) nextBtn.disabled = curIdx >= seasonEpisodes.length - 1;

    renderSbList();
    history.replaceState(null, "", `#watch/tv/${id}/${curSeason}/${curEpisode}`);
  };

  const switchSeason = async (newSeasonNum) => {
    curSeason = newSeasonNum;
    const sData = await fetchSeason(id, curSeason);
    seasonEpisodes = sData?.episodes || [];
    curEpisode = seasonEpisodes[0]?.episode_number || 1;
    const watchDD = $("#watchSeasonDD");
    if (watchDD) {
      const match = seasons.find(s => s.season_number === curSeason);
      if (match) $(".sdd-label", watchDD).textContent = match.name;
      $$("[data-snum]", watchDD).forEach(b => b.setAttribute("aria-selected", +b.dataset.snum === curSeason));
    }
    updateEpisode(curEpisode);
  };

  const watchDD = $("#watchSeasonDD");
  if (watchDD) {
    watchDD.addEventListener("click", e => {
      const opt = e.target.closest("[data-snum]");
      if (!opt) return;
      const sNum = +opt.dataset.snum;
      watchDD.classList.remove("open");
      switchSeason(sNum);
    });
  }
  $("#sbPrevBtn").onclick = () => {
    const curIdx = seasonEpisodes.findIndex(ep => ep.episode_number === curEpisode);
    if (curIdx > 0) updateEpisode(seasonEpisodes[curIdx - 1].episode_number);
  };
  $("#sbNextBtn").onclick = () => {
    const curIdx = seasonEpisodes.findIndex(ep => ep.episode_number === curEpisode);
    if (curIdx >= 0 && curIdx < seasonEpisodes.length - 1) updateEpisode(seasonEpisodes[curIdx + 1].episode_number);
  };
  $("#sbList").onclick = (e) => {
    const it = e.target.closest("[data-ep]");
    if (it) updateEpisode(+it.dataset.ep);
  };

  renderSbList();
  const curIdx = seasonEpisodes.findIndex(ep => ep.episode_number === curEpisode);
  const prevBtn = $("#sbPrevBtn"), nextBtn = $("#sbNextBtn");
  if (prevBtn) prevBtn.disabled = curIdx <= 0;
  if (nextBtn) nextBtn.disabled = curIdx >= seasonEpisodes.length - 1;
}

async function personPage(id) {
  if (!/^\d+$/.test(id || "")) return notFound();
  const my = ++token;
  app.innerHTML = '<div class="pp"><div class="pp-head"></div></div>';
  const d = await tmdb(`/person/${id}`, { append_to_response: "combined_credits,images,external_ids" });
  if (my !== token) return;
  document.title = `${d.name} · ${CONFIG.SITE_NAME}`;

  const cc = d.combined_credits || {};
  const when = c => c.release_date || c.first_air_date || "";
  const byDate = (a, b) => (when(b) || "9999").localeCompare(when(a) || "9999");
  const uniqBy = (arr, keyFn) => { const seen = new Set(); return arr.filter(x => { const k = keyFn(x); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const cast = uniqBy((cc.cast || []).slice().sort(byDate), c => c.media_type + c.id);
  const crew = uniqBy((cc.crew || []).slice().sort(byDate), c => c.media_type + c.id + c.job);

  /* known for: most popular real roles (not "Self" appearances or talk shows) */
  const real = cast.filter(c => !/\bself\b/i.test(c.character || "") && !(c.genre_ids || []).some(g => [10767, 10763, 10764].includes(g)));
  const known = (real.length >= 6 ? real : cast).filter(hasImg).sort((a, b) => (b.popularity || 0) - (a.popularity || 0)).slice(0, 12);

  const dept = d.known_for_department || "";
  const age = (from, to) => { const a = new Date(from), b = to ? new Date(to) : new Date(); let n = b.getFullYear() - a.getFullYear(); if (b < new Date(b.getFullYear(), a.getMonth(), a.getDate())) n--; return n; };
  const born = d.birthday ? `Born ${fmtDate(d.birthday)}${d.deathday ? "" : ` (age ${age(d.birthday)})`}${d.place_of_birth ? ` in ${d.place_of_birth}` : ""}` : (d.place_of_birth ? `Born in ${d.place_of_birth}` : "");
  const died = d.deathday ? `Died ${fmtDate(d.deathday)}${d.birthday ? ` (age ${age(d.birthday, d.deathday)})` : ""}` : "";
  const ex = d.external_ids || {};
  const links = [
    ex.imdb_id && ["IMDb", `https://www.imdb.com/name/${ex.imdb_id}`],
    ex.instagram_id && ["Instagram", `https://www.instagram.com/${ex.instagram_id}`],
    ex.twitter_id && ["X", `https://x.com/${ex.twitter_id}`],
    ["TMDB", `https://www.themoviedb.org/person/${d.id}`],
  ].filter(Boolean);
  const bio = (d.biography || "").trim().split(/\n+/).filter(Boolean);
  const bg = (known[0] && (known[0].backdrop_path || known[0].poster_path)) || "";

  app.innerHTML = `<div class="pp">
    <header class="pp-head">
      ${bg ? `<div class="pp-bg"><img src="${IMG(bg, "w1280")}" alt=""></div>` : ""}
      <button class="th-back" id="backBtn" aria-label="Back">${tIco.back}</button>
      <div class="pp-pic">${d.profile_path ? `<img src="${IMG(d.profile_path, "w342")}" alt="${esc(d.name)}">` : ""}</div>
      <div class="pp-info">
        <h1>${esc(d.name)}</h1>
        <p class="pp-sub">${[dept, born, died].filter(Boolean).map(esc).join(" · ")}</p>
        <div class="pp-links">${links.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>
        ${bio.length ? `<div class="pp-bio" id="bio">${bio.map(p => `<p>${esc(p)}</p>`).join("")}</div><button class="th-more" id="moreBtn" hidden>Read more</button>` : ""}
      </div>
    </header>
    <div id="secs"></div>
  </div>`;

  $("#backBtn").onclick = () => { if (history.length > 1) history.back(); else location.hash = "#home"; };
  const bioEl = $("#bio"), more = $("#moreBtn");
  if (bioEl && bioEl.scrollHeight > bioEl.clientHeight + 2) more.hidden = false;
  if (more) more.onclick = () => { const o = bioEl.classList.toggle("open"); more.textContent = o ? "Show less" : "Read more"; };

  const secs = $("#secs");

  if (known.length) {
    const s = makeRow("Known for");
    secs.appendChild(s);
    fillRow(s, Promise.resolve(known));
  }

  const profiles = d.images?.profiles || [];
  if (profiles.length > 1) {
    const s = makeRow("Photos");
    $(".track", s).innerHTML = profiles.slice(0, 24).map(im => `<button class="pimg" style="aspect-ratio:${im.aspect_ratio || .667}" data-f="${esc(im.file_path)}" data-w="w780"><img loading="lazy" src="${IMG(im.file_path, "w342")}" alt=""></button>`).join("");
    s.addEventListener("click", e => { const b = e.target.closest(".pimg"); if (b) openOverlay(`<img class="lbimg" src="${IMG(b.dataset.f, b.dataset.w)}" alt="">`, "lb"); });
    secs.appendChild(s);
  }

  const credits = (title, list, extra, limit) => {
    if (!list.length) return;
    const sec = document.createElement("section");
    sec.className = "ppsec";
    const render = all => {
      const items = all ? list : list.slice(0, limit);
      sec.innerHTML = `<h2>${title}</h2><div class="crl">${items.map(c => {
        const t = c.media_type === "tv" ? "tv" : "movie";
        const y = when(c).slice(0, 4);
        const note = [extra(c), c.media_type === "tv" && c.episode_count ? `${c.episode_count} ep` : ""].filter(Boolean).join(" · ");
        return `<a class="cr" href="#title/${t}/${c.id}"><span class="cy">${y || "Soon"}</span><b>${esc(c.title || c.name)}</b><span class="cc">${esc(note)}</span></a>`;
      }).join("")}</div>${list.length > limit ? `<button class="chipbtn" style="margin-left:0">${all ? "Show less" : "Show all"}</button>` : ""}`;
      const b = $(".chipbtn", sec);
      if (b) b.onclick = () => render(!all);
    };
    render(false);
    secs.appendChild(sec);
  };
  credits("Acting", cast, c => c.character ? `as ${c.character}` : "", 24);
  credits("Crew", crew, c => c.job || "", 12);

  if (!known.length && !cast.length && !crew.length) {
    const p = document.createElement("p");
    p.className = "ppsec"; p.style.color = "var(--mute)"; p.textContent = "No credits listed yet.";
    secs.appendChild(p);
  }
}

/* =====================================================================
   settings page
   ===================================================================== */
const SWATCH = {
  primary: ["d8392b", "f5b942", "ff4d6d", "38bdf8", "22c55e", "a78bfa", "ffffff"],
  icon: ["ffffff", "f5b942", "d8392b", "38bdf8", "22c55e", "a78bfa", "000000"],
};

function settingsPage(section) {
  document.title = `Settings · ${CONFIG.SITE_NAME}`;
  const sw = (k, title, desc) => `<div class="sr tog"><div><h3>${title}</h3><p>${desc}</p></div>
    <button class="sw" role="switch" aria-checked="${settings[k]}" aria-label="${title}" data-sw="${k}"></button></div>`;
  const colors = (k, title) => `<div class="crow"><span>${title}</span><div class="sws">
    ${SWATCH[k].map(h => `<button class="cs" data-k="${k}" data-v="${h}" style="background:#${h}" aria-label="#${h}"></button>`).join("")}
    <label class="cs custom" title="Custom colour"><input type="color" data-k="${k}" value="#${settings[k]}" aria-label="${title}, custom colour"></label></div></div>`;

  app.innerHTML = `<div class="set">
    <nav class="set-nav" aria-label="Settings sections">
      <a href="#settings/player" data-s="player">Player</a>
      <a href="#settings/browsing" data-s="browsing">Browsing</a>
      ${CONFIG.ENC_KEY ? "" : `<a href="#settings/api" data-s="api">API</a>`}
    </nav>
    <div class="set-main">
      <section id="s-player" data-sec="player"><h2 class="sh">Player</h2><div class="sg">
        <div class="sr"><div class="pv"><iframe id="pv" title="Player preview" loading="lazy" allow="fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe></div>
          <p class="hint">Preview. Your choice applies to every title.</p></div>
        <div class="sr"><h3>Style</h3><div class="pgrid">
          ${PLAYERS.map(p => `<button class="opt" data-player="${p.id}"><b>${p.name}</b><small>${p.d}</small></button>`).join("")}</div></div>
        <div class="sr"><h3>Colours</h3>${colors("primary", "Accent")}${colors("icon", "Icons")}</div>
        ${sw("autoplay", "Autoplay", "Start playing as soon as a title opens. Some browsers block this.")}
      </div></section>

      <section id="s-browsing" data-sec="browsing"><h2 class="sh">Browsing</h2><div class="sg">
        ${sw("heroRotate", "Rotate featured titles", "Change the featured title at the top of Home every few seconds.")}
        ${sw("hoverZoom", "Zoom pictures on hover", "Slightly enlarge a picture when you point at it.")}
        ${sw("titledThumbs", "Title in thumbnails", "Show artwork with the English movie or series logo when available from TMDB.")}
      </div></section>

      ${CONFIG.ENC_KEY ? "" : `<section id="s-api" data-sec="api"><h2 class="sh">API</h2><div class="sg">
        <div class="sr"><h3>TMDB API key</h3><p>Used for titles, posters and ratings. Saved locally in this browser.</p>
          <form class="keyf" id="kf2"><input type="password" id="kin2" autocomplete="off" aria-label="TMDB API key"
            placeholder="${getKey() ? "Key saved. Paste a new one to replace it" : "Paste your TMDB key"}">
            <button class="pill solid" type="submit">Save</button></form><p class="hint" id="kmsg" role="status"></p></div>
      </div></section>`}


      <section><div class="sg"><div class="sr tog"><div><h3>Reset settings</h3><p>Return the player and browsing options to their defaults.</p></div>
        <button class="pill" data-act="reset">Reset</button></div></div></section>
    </div></div>`;

  const main = $(".set-main");
  let timer;
  const refreshPreview = () => {
    clearTimeout(timer);
    timer = setTimeout(() => { const f = $("#pv"); if (f) f.src = embedSrc("movie", CONFIG.PREVIEW_ID, 1, 1, { autoplay: false }); }, 350);
  };
  const sync = () => {
    $$("[data-player]", main).forEach(b => { const on = b.dataset.player === settings.player; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    for (const k of ["primary", "icon"]) {
      const presets = SWATCH[k];
      $$(`.cs[data-v][data-k="${k}"]`, main).forEach(b => b.classList.toggle("on", b.dataset.v === settings[k]));
      const input = $(`input[data-k="${k}"]`, main);
      input.value = "#" + settings[k];
      input.parentElement.classList.toggle("on", !presets.includes(settings[k]));
    }
    $$("[data-sw]", main).forEach(b => b.setAttribute("aria-checked", settings[b.dataset.sw]));
  };
  const commit = (preview = true) => { saveSettings(); sync(); if (preview) refreshPreview(); };

  main.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.player) { settings.player = t.dataset.player; commit(); }
    else if (t.dataset.k && t.dataset.v) { settings[t.dataset.k] = t.dataset.v; commit(); }
    else if (t.dataset.sw) { settings[t.dataset.sw] = !settings[t.dataset.sw]; commit(false); }
    else if (t.dataset.act === "reset") { settings = { ...DEFAULTS }; commit(); }
  });
  main.addEventListener("input", e => {
    if (e.target.type === "color" && HEX.test(e.target.value.slice(1))) { settings[e.target.dataset.k] = e.target.value.slice(1).toLowerCase(); commit(); }
  });
  if ($("#kf2")) $("#kf2").onsubmit = e => {
    e.preventDefault();
    const v = $("#kin2").value.trim();
    if (!v) return;
    localStorage.setItem("sf_tmdb_key", v);
    cache.clear();
    $("#kin2").value = "";
    $("#kin2").placeholder = "Key saved. Paste a new one to replace it";
    $("#kmsg").textContent = "Saved.";
  };

  const mark = s => $$(".set-nav a").forEach(a => a.classList.toggle("on", a.dataset.s === s));
  const goTo = (s, smooth = true) => { const el = $("#s-" + s); if (el) el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" }); mark(s); };
  $$(".set-nav a").forEach(a => a.onclick = e => { e.preventDefault(); history.replaceState(null, "", "#settings/" + a.dataset.s); goTo(a.dataset.s); });
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) mark(en.target.dataset.sec); }), { rootMargin: "-25% 0px -65% 0px" });
  $$("[data-sec]").forEach(el => io.observe(el));
  // at the very bottom of a short page the last section can't reach the top, so highlight it
  window.removeEventListener("scroll", window._sfSpy);
  window._sfSpy = () => { if ($(".set-nav") && innerHeight + scrollY >= document.documentElement.scrollHeight - 4) mark($$(".set-nav a").at(-1).dataset.s); };
  window.addEventListener("scroll", window._sfSpy, { passive: true });

  sync();
  $("#pv").src = embedSrc("movie", CONFIG.PREVIEW_ID, 1, 1, { autoplay: false });
  if ($$(".set-nav a").some(a => a.dataset.s === section)) requestAnimationFrame(() => goTo(section, false)); else mark("player");
}

/* =====================================================================
   router:  #home  #movies  #movies/28  #series  #series/18  #4k
            #search/query  #title/movie/ID  #title/tv/ID
   ===================================================================== */
async function route() {
  clearInterval(heroTimer);
  document.title = CONFIG.SITE_NAME;
  const [path, qs = ""] = (location.hash.replace(/^#\/?/, "") || "home").split("?");
  const [page, a, b, c, d] = path.split("/");
  setActive(page === "title" || page === "person" || page === "watch" ? "" : page);
  closePops();
  if (page !== "search") resetSearch();
  window.scrollTo(0, 0);
  try {
    if (!getKey() && (page !== "settings" || CONFIG.ENC_KEY)) throw new Error("NO_KEY");
    switch (page) {
      case "home": return await home();
      case "movies": if (a) { location.hash = `#discover?type=movie&genre=${a}`; return; } return await featuredPage("movie");
      case "series": if (a) { location.hash = `#discover?type=tv&genre=${a}`; return; } return await featuredPage("tv");
      case "4k": return await featuredPage("uhd");
      case "discover": return await discoverPage(new URLSearchParams(qs));
      case "search": return searchPage(decodeURIComponent(a || ""));
      case "title": return await titlePage(a, b);
      case "watch": return await watchPage(a, b, c, d);
      case "person": return await personPage(a);
      case "settings": return settingsPage(a);
      default: return notFound();
    }
  } catch (e) { showError(e); }
}
addEventListener("hashchange", route);

/* =====================================================================
   nav: search & settings
   ===================================================================== */
const nav = $("#nav"), q = $("#q"), searchPop = $("#searchPop");
let searchDebounceTimer = null;

function resetSearch() {
  clearTimeout(searchDebounceTimer);
  q.value = "";
  q.blur();
  nav.classList.remove("searching");
  searchPop.classList.remove("open");
  searchPop.innerHTML = "";
}

async function renderSearchPreview(val) {
  if (!getKey()) return;
  try {
    const d = await tmdb("/search/multi", { query: val, page: 1 });
    if (q.value.trim() !== val) return;
    const items = (d.results || []).filter(r => (r.media_type === "movie" || r.media_type === "tv") && hasImg(r)).slice(0, 5);
    if (!items.length) {
      searchPop.innerHTML = `<h4>Suggestions</h4><p style="padding:8px 10px;font-size:13.5px;color:var(--mute)">No titles found.</p>`;
    } else {
      searchPop.innerHTML = `<h4>Suggestions</h4>` +
        items.map(it => {
          const t = it.media_type || kind(it);
          const name = it.title || it.name;
          const img = IMG(it.backdrop_path || it.poster_path, "w500");
          const score = it.vote_average ? it.vote_average.toFixed(1) : "";
          return `<a href="#title/${t}/${it.id}">
            <img src="${img}" alt="">
            <div style="min-width:0">
              <strong>${esc(name)}</strong>
              <small>${score ? "★ " + score + " · " : ""}${t === "tv" ? "Series" : "Movie"} · ${yr(it)}</small>
            </div>
          </a>`;
        }).join("") +
        `<a href="#search/${encodeURIComponent(val)}" style="justify-content:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line);margin-top:4px;padding-top:10px">See all results for “${esc(val)}”</a>`;
    }
    searchPop.classList.add("open");
  } catch (err) {}
}

$("#sbtn").onclick = () => {
  if (nav.classList.toggle("searching")) {
    q.focus();
    if (q.value.trim().length >= 2) renderSearchPreview(q.value.trim());
  } else if (q.value.trim()) {
    closePops();
    location.hash = "#search/" + encodeURIComponent(q.value.trim());
  }
};
q.addEventListener("input", () => {
  clearTimeout(searchDebounceTimer);
  const val = q.value.trim();
  if (val.length < 2) {
    searchPop.classList.remove("open");
    searchPop.innerHTML = "";
    return;
  }
  searchDebounceTimer = setTimeout(() => renderSearchPreview(val), 250);
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && q.value.trim()) {
    closePops();
    location.hash = "#search/" + encodeURIComponent(q.value.trim());
  }
  if (e.key === "Escape") {
    closePops();
    nav.classList.remove("searching");
    q.blur();
  }
});
q.addEventListener("blur", () => {
  setTimeout(() => {
    if (!q.value.trim()) nav.classList.remove("searching");
  }, 200);
});

const closePops = () => $$(".pop").forEach(p => p.classList.remove("open"));
$("#settingsBtn").onclick = () => { location.hash = "#settings/player"; };
document.addEventListener("click", e => {
  if (!e.target.closest(".pos") || e.target.closest(".pop a")) closePops();
  const btn = e.target.closest(".ddb");
  $$(".dd.open").forEach(d => { if (!btn || d !== btn.parentElement) d.classList.remove("open"); });
  if (btn) { const d = btn.parentElement; d.classList.toggle("open"); btn.setAttribute("aria-expanded", d.classList.contains("open")); }
  if (e.target.closest(".ddm button, .ddm a")) $$(".dd.open").forEach(d => d.classList.remove("open"));
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePops(); $$(".dd.open").forEach(d => d.classList.remove("open")); } });

applySettings();
$$(".brand span").forEach(el => el.textContent = CONFIG.SITE_NAME);
$$(".brand").forEach(el => el.setAttribute("aria-label", CONFIG.SITE_NAME + " home"));
route();
</script>
</body>
